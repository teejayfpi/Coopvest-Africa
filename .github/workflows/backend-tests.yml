name: Backend Tests

# Runs the backend suite on every push and PR.
#
# Why this exists: the suite is large (670+ tests) and ran nowhere. Every
# commit was therefore unverified in CI, and the deploy workflow shipped to
# production without checking anything. The tests need no credentials — they
# run against a stubbed Supabase client — so this job is fast and cannot fail
# for environmental reasons.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Jest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # Deliberately not `|| true`. A test that cannot fail the build is
        # decoration, not a check.
        run: npm test
