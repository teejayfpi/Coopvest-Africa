plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def projectDir = project.rootProject.projectDir

android {
    namespace "com.coopvestafrica.app"
    compileSdk 36

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.coopvestafrica.app"
        // 24 = Android 7.0 — the floor for Flutter 3.44's embedding + the
        // Firebase stack (raising it was forced by those libraries, not the
        // app). The universal APK below is what makes old & new devices see
        // an installable binary.
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            // Use the default debug keystore if the custom one is not found
            def customKeystore = file("$projectDir/../../android/key/debug-keystore.jks")
            if (customKeystore.exists()) {
                storeFile customKeystore
            } else {
                // Default debug keystore location for most CI environments
                storeFile file('debug.keystore')
            }
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (keystorePropertiesFile.exists() && keystoreProperties['storeFile'] != null) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else {
                // Fallback to debug signing for now to allow builds to pass without key.properties
                signingConfig signingConfigs.debug
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // The app only ships English strings; strip the translations bundled by
    // third-party libraries from the APK.
    //
    // NOTE: do NOT add a splits.abi block here — the Flutter Gradle plugin
    // injects ndk.abiFilters programmatically when the 'split-per-abi'
    // project property is unset, and the two configurations conflict
    // ("Conflicting configuration ... cannot be present when splits abi
    // filters are set"). Build per-ABI APKs with:
    //   flutter build apk --release --split-per-abi
    defaultConfig {
        resConfigs "en"
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/LICENSE*'
            excludes += '/META-INF/NOTICE*'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds true
        warningsAsErrors false
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.activity:activity-ktx:1.8.2"
    implementation "androidx.multidex:multidex:2.0.1"

    // Biometric Authentication
    implementation 'androidx.biometric:biometric:1.1.0'

    // Firebase dependencies are managed by Flutter plugins.
    // Manual implementation here can cause conflicts or resolution errors.
    implementation platform("com.google.firebase:firebase-bom:33.1.0")
    implementation "com.google.firebase:firebase-messaging"
}
